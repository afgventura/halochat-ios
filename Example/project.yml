# Sample app: `brew install xcodegen && xcodegen generate`, then open HaloChatSample.xcodeproj.
name: HaloChatSample
options:
  bundleIdPrefix: com.example.halochat
  deploymentTarget:
    iOS: "15.0"
packages:
  HaloChat:
    path: ..
targets:
  HaloChatSample:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: HaloChat
        product: HaloChat
      - package: HaloChat
        product: HaloChatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.halochat.sample
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: HaloChat Sample
        # Attach sheet: Camera needs this. The Gallery uses PHPicker (no permission needed);
        # the photo-library key is only for apps that also use UIImagePickerController's library.
        NSCameraUsageDescription: Take a photo to send to customer service.
        NSPhotoLibraryUsageDescription: Choose a photo or video to send to customer service.
        # Only for the local sample backend on http://127.0.0.1; your real backend uses HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
